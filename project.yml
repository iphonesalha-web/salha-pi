name: SalhaPi
options:
  bundleIdPrefix: com.salha
  deploymentTarget:
    iOS: "17.0"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  NIOSSH:
    # نفس النسخة التي يعتمد عليها Citadel
    url: https://github.com/Wellz26/swift-nio-ssh.git
    minorVersion: 0.3.4
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
targets:
  SalhaPi:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Citadel
      - package: SwiftNIO
        product: NIOCore
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftTerm
    scheme: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "صالحة Pi"
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "للاتصال بالـ Raspberry Pi في شبكة البيت."
        NSBonjourServices:
          - _ssh._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salha.pi
        PRODUCT_NAME: SalhaPi
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
